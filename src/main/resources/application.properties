spring.application.name=ms-analytics

# ===============================
# SERVIDOR
# ===============================

server.port=8088
server.error.include-message=always

# ===============================
# KAFKA (consume el topico tienda.eventos)
# En AWS: variable de entorno SPRING_KAFKA_BOOTSTRAP_SERVERS
# ===============================

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ms-analytics
# Al conectarse por primera vez, lee el topico desde el inicio (incluye eventos antiguos)
spring.kafka.consumer.auto-offset-reset=earliest

# ===============================
# DYNAMODB
# Local: DynamoDB Local en Docker (puerto 8000).
# En AWS: AWS_DYNAMODB_ENDPOINT vacio -> usa el DynamoDB real con el rol de la EC2 (LabInstanceProfile)
# ===============================

aws.region=us-east-1
aws.dynamodb.endpoint=http://localhost:8000

analytics.tabla-interacciones=pedidos360_interacciones
analytics.tabla-productos=pedidos360_metricas_producto

# ===============================
# MS-PRODUCTOS (catalogo para armar las recomendaciones - paso 4.3)
# En AWS: variable de entorno PRODUCTOS_API_URL
# ===============================

productos.api.url=http://localhost:8081